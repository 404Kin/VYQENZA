<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | VYQENZA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container">
        <h2 class="section-title" style="margin-top:60px">Your Shopping Cart</h2>
        <div class="cart-page" id="cart-page">
            <div id="cart-page-items"></div>
            <div class="cart-total" style="font-size:20px"><span>Total:</span><span id="page-total">TK0.00</span></div>
            <form id="checkout-form" class="stack-form">
                <h3>Delivery details</h3>
                <input name="name" placeholder="Full name" required>
                <input name="phone" placeholder="Phone number" required>
                <input name="city" placeholder="City" required>
                <textarea name="address" rows="3" placeholder="Full delivery address" required></textarea>
                <p class="note">Payment: Cash on Delivery</p>
                <button class="checkout-btn" id="place-order-btn">Place Order</button>
            </form>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
